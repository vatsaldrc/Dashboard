stages:
  - build

variables:
  IMAGE_NAME: docker.ryze-digital.de/botpress/dashboard
  IMAGE_TAGGED: "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST_DEV: "$IMAGE_NAME:latest-dev"
  TZ: Europe/Berlin
  LOG_LEVEL: INFO
  MYSQL_HOST: $MYSQL_HOST
  MYSQL_USER: $MYSQL_USER
  MYSQL_PASSWORD: $MYSQL_PASSWORD
  MYSQL_DATABASE: $MYSQL_DATABASE
  WORKFLOW_ID: $WORKFLOW_ID

before_script:
  - echo "Starting CI/CD pipeline for botpress dashboard..."

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: always
  script:
    # Login to registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.ryze-digital.de

    - echo "🚀 Building Docker image..."

    # Build image once
    - docker build -t $IMAGE_TAGGED --target runner .

    # Tag for dev and ryze
    - docker tag $IMAGE_TAGGED $IMAGE_LATEST_DEV
    - docker tag $IMAGE_TAGGED $IMAGE_LATEST_RYZE

    - echo "📦 Pushing images..."

    # Push all tags
    - docker push $IMAGE_TAGGED
    - docker push $IMAGE_LATEST_DEV
    - docker push $IMAGE_LATEST_RYZE

    - echo "Build and push completed successfully"