stages:
  - build
  # - deploy

variables:
  IMAGE_NAME: docker.ryze-digital.de/ryze-digital/ai-products/chatbot-botpress-dashboard
  IMAGE_TAGGED: "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST_DEV: "$IMAGE_NAME:latest-dev"
  TZ: Europe/Berlin
  LOG_LEVEL: INFO
  MYSQL_HOST: $MYSQL_HOST
  MYSQL_USER: $MYSQL_USER
  MYSQL_PASSWORD: $MYSQL_PASSWORD
  MYSQL_DATABASE: $MYSQL_DATABASE

before_script:
  - echo "Starting CI/CD pipeline for botpress dashboard..."

# -------------------
# Build & Push Docker
# -------------------
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: always
  script:
    # Login to registry
    - echo "Logging in to Docker registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.ryze-digital.de

    # Build Docker image from Dockerfile
    - echo "Building Docker image..."
    - docker build -t $IMAGE_TAGGED --target runner .

    # Tag the image with latest-dev
    - echo "Tagging image with latest-dev..."
    - docker tag $IMAGE_TAGGED $IMAGE_LATEST_DEV

    # Push both tags
    - echo "Pushing images to registry..."
    - docker push $IMAGE_TAGGED
    - docker push $IMAGE_LATEST_DEV

    - echo "Build and push for development completed successfully"
